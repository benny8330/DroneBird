name: Build DroneBird APK

# Builds the debug APK on every push (and on manual run) and uploads it as a
# downloadable artifact. No Android Studio needed — GitHub's runner has internet
# access to Google's Maven + JitPack, which the author's sandbox did not.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dronebird-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
